<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사전 체험단 신청 완료 | 코코노미</title>
    <style>
      :root {
        color: #071321;
        font-family:
          Pretendard,
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          system-ui,
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 138, 76, 0.18), transparent 34%),
          linear-gradient(135deg, #fff7ef 0%, #eefaff 100%);
      }

      main {
        width: min(520px, calc(100% - 40px));
        padding: 48px 34px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 24px 70px rgba(35, 62, 93, 0.14);
        text-align: center;
      }

      h1 {
        margin: 0 0 14px;
        color: #f0643a;
        font-size: clamp(30px, 6vw, 44px);
        letter-spacing: -0.05em;
      }

      p {
        margin: 0 0 28px;
        color: #42566d;
        font-size: 17px;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        background: #ff7a45;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 12px 24px rgba(255, 122, 69, 0.28);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>신청이 완료되었습니다</h1>
      <p>
        경제 교육 앱 코코노미 사전 체험단 모집에 관심을 가져주셔서 감사합니다.<br />
        입력해주신 연락처로 안내를 보내드릴게요.
      </p>
      <a href="/">랜딩페이지로 돌아가기</a>
    </main>
  </body>
</html>
